# CHECK BEFORE GOING LIVE: the old site showed 2026 for several entries
# marked "# check year". That may be a database default rather than the real
# year. Confirm with members and correct or remove the year.

- name: Mick Jefferson
  call: G8WYB
  year: 2026 # check year
  tribute: >-
    A long-standing member who died aged 92. No single person knew more about
    Scarborough than Mick. He was a long-running reporter for the Scarborough
    Evening News and later freelance, and acted as the society's press
    representative, officially or not, making sure SARS got publicised. He had a
    boat too, and was never seen in a car, always on a small motorbike or moped.

- name: Frederick (Fred) Hall
  call: M3CTW
  year: 2026 # check year
  photo: M3CTW.jpg
  tribute: >-
    G7PKG said of Fred: "When I drove Fred back, after being at the club, to the
    caravan where he was staying, he was telling me all about his work as a watch
    and clock repairer. It was a fascinating journey as Fred told me about how
    fine and small some of the parts were. He will be sadly missed."

- name: Ron Young
  call: G4GWC
  year: 2026 # check year
  photo: G4GWC.jpg
  tribute: >-
    A keen member of SARS who put a lot of effort into his antennas and into
    training others. Ron co-wrote the club's Morse practice course.

- name: Ray Nellis
  call: 2E1BZA
  year: 2026 # check year
  tribute: Ray sadly passed away aged 80.

- name: Peter Robson
  call: G3FYP
  year: 2026 # check year
  tribute: >-
    Peter was a constructor and did a lot of portable and mobile operating
    because of the limitations of his home QTH. He took part in many VHF contests.

