  call: M0GZX / SM5ELF
  year: 2026 # check year

- name: Peter Tipper
  call: G3JBR
  year: 2026 # check year

- name: Bob (Robert) Alders
  call: M0GAP
  year: 2023
  photo: M0GAP.jpg
  tribute: >-
    Bob Alders, or Robert as I had always called him, was a lovely man and was
    one of the amateur radio trainers at the club. I believe he was one of the
    adjudicators too when we used to hold our exams at the Crossgates Community
    Centre. Sad loss, may he rest in peace. Our thoughts are with his family.

- name: Ger Akse
  call: PA1AXE
  year: 2020
  photo: PA1AXE.jpg
  tribute: >-
    Phil G4OBK said: "Ger Akse as I knew him through his partner Christine
    initially, who worked with my wife Judy in Pickering in the noughties. I
    introduced Ger to SARS in the period when I wasn't a member and he soon
    became Chairman. Ger worked tirelessly for the society and
    hosted CW National Field Day in his garden on more than one occasion. I
    operated in that contest for SARS one year from Ger's garden."

- name: Tony Blythe
  call: G3LOJ
  year: 2015
  tribute: >-
    Tony died on 6 January 2015, aged 84. He held DXCC on 80 metres, was ex-RAF,
    and was a real CW enthusiast. He lived in Kirkbymoorside.

- name: Ernest (Ernie) Stankiste BEM
  call: G4FCH
  year: 2014
  tribute: >-
    Ernie was an ex-Royal Navy CW wireless operator who served in many parts of
    the world during the Second World War, and later worked at GCHQ. A long-standing
    member, he operated regularly on Field Day events and was secretary for many
    years. He died peacefully on 30 November 2014, aged 93.

- name: Jim Yarker
  call: G3GJY
  year: 2011
  tribute: >-
    Phil G4OBK said: "Jim Yarker worked at RAF Fylingdales. Other old timers will
    know him better than me. When we lived where we do now from 1996-2000 I
    visited Jim Yarker a few times. Jim was active in CW and on
    phone. His 3-element trapped Yagi on a wind-up mast was prominent and was
    noticed by hams from all over, driving by on their way to Whitby on the main A169."

- name: Geoff Pritchard
  call: G4ZGP
  year: 2010
  tribute: >-
    Made an Honorary Member of SARS before leaving for Stockport. Geoff was the
    UK Deputy Chief Morse Examiner, serving under Roy G4SSH for ten years until the
    Morse test ended. He prided himself on sending perfect Morse with a straight
    key, and was a true gentleman.

- name: Henry Wiggins
  call: G2CP
  year: 1998
  tribute: SARS took on his callsign, G2CP, for use in QRP contests.

- name: Robert (Bob) Wilkinson
  tribute: >-
    The repeater's callsign, GB7RW, carries his initials: the RW stands for
    Robert Wilkinson.

- name: Andy Gauld
  call: G0KFG
  tribute: >-
    Andy lived in Newby, Scarborough. A Scot, he flew in Lancasters using their
    R1155 receiver. A lovely chap.

